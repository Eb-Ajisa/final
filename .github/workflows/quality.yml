name: Quality

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run JUnit regression tests
        run: ./mvnw -B clean test

      - name: Run PIT mutation testing
        run: ./mvnw -B org.pitest:pitest-maven:mutationCoverage

      - name: Run SpotBugs analysis
        run: ./mvnw -B spotbugs:check

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/
          if-no-files-found: warn

      - name: Upload SpotBugs SARIF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-sarif
          path: target/spotbugsSarif.json
          if-no-files-found: warn
